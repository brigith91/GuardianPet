<header class="barra-superior">
  <div class="logo">
    <img class="imagen-logo" src="assets/logo.png" alt="Logo GuardianPet" />
    <span class="texto-logo"><strong>Guardian</strong>Pet</span>
  </div>

  <div class="barra-busqueda">
    <span class="icono-busqueda">🔍</span>
    <input type="text" class="campo-busqueda" placeholder="Buscar mascota" />
  </div>

  <div class="perfil-usuario" *ngIf="me as u">
    <div class="avatar-usuario">{{ iniciales(u.nombre) }}</div>
    <span class="nombre-usuario">{{ u.nombre }}</span>
  </div>
</header>

<div class="contenedor-principal">
  <aside class="barra-lateral">
    <div class="item-menu activo">
      <span class="icono-menu">🐾</span>
      <span class="texto-menu">Mascotas</span>
    </div>

    <app-mascotas-sidebar
      [mascotas]="mascotas"
      [seleccionada]="seleccionada"
      [usuarioId]="me?.id"
      (seleccionar)="seleccionarMascota($event)"
      (creada)="mascotaCreada($event)"
    ></app-mascotas-sidebar>

    <div class="item-menu configuracion">
      <span class="icono-menu">⚙️</span>
      <span class="texto-menu">Configuración</span>
    </div>
  </aside>

  <main class="area-contenido" *ngIf="seleccionada as pet; else noSelection">
    <div class="encabezado-mascota">
      <img
      [src]="
        pet.url_foto ||
        'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=100&h=100&fit=crop'
      "
      [alt]="pet.nombre"
      class="foto-mascota-grande"
    />
      <div class="info-mascota-grande">
        <h2 class="nombre-mascota-grande">{{ pet.nombre }}</h2>
        <p class="texto-info">{{ pet.raza || pet.especie || 'Mascota' }}</p>
        <p class="texto-info">Dueño • {{ me?.nombre }}</p>
      </div>
    </div>

    <!-- radios para tabs (siguen igual para tu CSS) -->
    <input
      type="radio"
      id="tab-historial-radio"
      name="tabs"
      class="tab-radio"
      checked
    />
    <input type="radio" id="tab-citas-radio" name="tabs" class="tab-radio" />

    <div class="tabs-navegacion">
      <label for="tab-historial-radio" class="tab activo">Historial clínico</label>
      <label for="tab-citas-radio" class="tab">Citas programadas</label>
    </div>

    <div id="contenido-historial" class="contenido-tab">
      <app-historial-clinico [pet]="pet"></app-historial-clinico>
    </div>

    <div id="contenido-citas" class="contenido-tab">
      <app-citas-programadas [pet]="pet"></app-citas-programadas>
    </div>
  </main>

  <ng-template #noSelection>
    <main class="area-contenido">
      <p class="texto-vacio">Selecciona una mascota para ver su historial.</p>
    </main>
  </ng-template>
</div>
