<div class="seccion-mascotas">
  <h3 class="titul">Mascotas</h3>

  <ng-container *ngIf="mascotas?.length; else noPets">
    <div
      class="tarjeta-mascota"
      *ngFor="let m of mascotas"
      (click)="seleccionarMascota(m)"
      [class.seleccionada]="m.id === seleccionada?.id"
    >
      <!-- Botón editar -->
      <button
        type="button"
        class="boton-editar-mascota"
        (click)="$event.stopPropagation(); editarMascota(m)"
      >
        ✏️
      </button>

      <img [src]="fotoSegura(m)" [alt]="m.nombre" class="foto-mascota" />

      <div class="info-mascota">
        <h4 class="nombre-mascota">{{ m.nombre }}</h4>
        <p class="detalles-mascota">
          {{ m.especie || 'Mascota' }}
          <ng-container *ngIf="m.raza"> • {{ m.raza }}</ng-container>
        </p>
      </div>
    </div>
  </ng-container>

  <ng-template #noPets>
    <p class="texto-vacio">Aún no tienes mascotas registradas.</p>
  </ng-template>
</div>

<!-- BOTÓN / MODAL CREAR MASCOTA -->
<label for="toggleModalMascota" class="boton-agregar-mascota">
  <span class="icono-mas">+</span> Agregar mascota
</label>

<input
  type="checkbox"
  id="toggleModalMascota"
  class="modal-toggle"
  #toggleModalMascota
/>

<div class="modal">
  <div class="modal-contenido">
    <div class="contenedor-centro">
      <div class="contenedor">
        <label for="toggleModalMascota" class="boton-cerrar">&times;</label>
        <h2 class="titulo">Agregar nueva Mascota</h2>

        <form #formMascota="ngForm" (ngSubmit)="onSubmitNueva(formMascota)">
          <div class="campo">
            <label class="etiqueta">Nombre</label>
            <input
              type="text"
              class="entrada"
              placeholder="Nombre de la mascota"
              required
              name="nombre"
              [(ngModel)]="nueva.nombre"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Especie</label>
            <input
              type="text"
              class="entrada"
              placeholder="Especie"
              required
              name="especie"
              [(ngModel)]="nueva.especie"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Raza</label>
            <input
              type="text"
              class="entrada"
              placeholder="Raza"
              name="raza"
              [(ngModel)]="nueva.raza"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Sexo</label>
            <input
              type="text"
              class="entrada"
              placeholder="Sexo"
              required
              name="sexo"
              [(ngModel)]="nueva.sexo"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Fecha de nacimiento</label>
            <input
              type="date"
              class="entrada"
              required
              name="fecha_nacimiento"
              [(ngModel)]="nueva.fecha_nacimiento"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Foto</label>
            <input
              type="file"
              class="entrada"
              accept="image/*"
              (change)="onFileChange($event)"
            />
            <small *ngIf="nombreArchivo">Archivo: {{ nombreArchivo }}</small>
          </div>

          <p class="error" *ngIf="errorCrear">
            {{ errorCrear }}
          </p>

          <button
            type="submit"
            class="boton-guardar"
            [disabled]="formMascota.invalid || creando"
          >
            {{ creando ? 'Guardando...' : 'Agregar mascota' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDITAR MASCOTA -->
<input
  type="checkbox"
  id="toggleModalEditarMascota"
  class="modal-toggle"
  #toggleModalEditarMascota
/>

<div class="modal" *ngIf="edit">
  <div class="modal-contenido">
    <div class="contenedor-centro">
      <div class="contenedor">
        <label for="toggleModalEditarMascota" class="boton-cerrar">&times;</label>
        <h2 class="titulo">Editar Mascota</h2>

        <form
          #formEditarMascota="ngForm"
          (ngSubmit)="onSubmitEditar(formEditarMascota)"
        >
          <div class="campo">
            <label class="etiqueta">Nombre</label>
            <input
              type="text"
              class="entrada"
              placeholder="Nombre de la mascota"
              required
              name="edit_nombre"
              [(ngModel)]="edit!.nombre"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Especie</label>
            <input
              type="text"
              class="entrada"
              placeholder="Especie"
              required
              name="edit_especie"
              [(ngModel)]="edit!.especie"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Raza</label>
            <input
              type="text"
              class="entrada"
              placeholder="Raza"
              name="edit_raza"
              [(ngModel)]="edit!.raza"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Sexo</label>
            <input
              type="text"
              class="entrada"
              placeholder="Sexo"
              required
              name="edit_sexo"
              [(ngModel)]="edit!.sexo"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Fecha de nacimiento</label>
            <input
              type="date"
              class="entrada"
              required
              name="edit_fecha_nacimiento"
              [(ngModel)]="edit!.fecha_nacimiento"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Foto</label>
            <input
              type="file"
              class="entrada"
              accept="image/*"
              (change)="onFileChangeEditar($event)"
            />
            <small *ngIf="editNombreArchivo">
              Archivo: {{ editNombreArchivo }}
            </small>
          </div>

          <p class="error" *ngIf="errorEditar">
            {{ errorEditar }}
          </p>

          <button
            type="submit"
            class="boton-guardar"
            [disabled]="formEditarMascota.invalid || editando"
          >
            {{ editando ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
