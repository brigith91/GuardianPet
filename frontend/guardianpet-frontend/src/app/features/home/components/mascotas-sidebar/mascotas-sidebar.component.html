<!-- src/app/features/home/components/mascotas-sidebar/mascotas-sidebar.component.html -->

<div class="seccion-mascotas">
  <h3 class="titul">Mascotas</h3>

  <ng-container *ngIf="mascotas?.length; else noPets">
    <div
      class="tarjeta-mascota"
      *ngFor="let m of mascotas"
      (click)="seleccionarMascota(m)"
      [class.seleccionada]="m.id === seleccionada?.id"
    >
      <img
        [src]="
          m.url_foto ||
          'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=60&h=60&fit=crop'
        "
        [alt]="m.nombre"
        class="foto-mascota"
      />
      <div class="info-mascota">
        <h4 class="nombre-mascota">{{ m.nombre }}</h4>
        <p class="detalles-mascota">
          {{ m.especie || 'Mascota' }}
          <ng-container *ngIf="m.raza"> • {{ m.raza }}</ng-container>
        </p>
      </div>
    </div>
  </ng-container>

  <ng-template #noPets>
    <p class="texto-vacio">Aún no tienes mascotas registradas.</p>
  </ng-template>
</div>

<label for="toggleModalMascota" class="boton-agregar-mascota">
  <span class="icono-mas">+</span> Agregar mascota
</label>

<input type="checkbox" id="toggleModalMascota" class="modal-toggle" />
<div class="modal">
  <div class="modal-contenido">
    <div class="contenedor-centro">
      <div class="contenedor">
        <label for="toggleModalMascota" class="boton-cerrar">&times;</label>
        <h2 class="titulo">Agregar nueva Mascota</h2>

        <form
          class="formulario"
          #formMascota="ngForm"
          (ngSubmit)="onSubmitNueva(formMascota)"
        >
          <div class="campo">
            <label class="etiqueta">Nombre</label>
            <input
              type="text"
              class="entrada"
              placeholder="Nombre de la mascota"
              required
              name="nombre"
              [(ngModel)]="nueva.nombre"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Especie</label>
            <input
              type="text"
              class="entrada"
              placeholder="Especie"
              required
              name="especie"
              [(ngModel)]="nueva.especie"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Raza</label>
            <input
              type="text"
              class="entrada"
              placeholder="Raza"
              required
              name="raza"
              [(ngModel)]="nueva.raza"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Sexo</label>
            <input
              type="text"
              class="entrada"
              placeholder="Sexo"
              required
              name="sexo"
              [(ngModel)]="nueva.sexo"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">Fecha nacimiento</label>
            <input
              type="date"
              class="entrada"
              required
              name="fecha_nacimiento"
              [(ngModel)]="nueva.fecha_nacimiento"
            />
          </div>

          <div class="campo">
            <label class="etiqueta">URL foto (opcional)</label>
            <input
              type="url"
              class="entrada"
              placeholder="https://..."
              name="url_foto"
              [(ngModel)]="nueva.url_foto"
            />
          </div>

          <p class="mensaje-error" *ngIf="errorCrear">
            {{ errorCrear }}
          </p>

          <button
            type="submit"
            class="boton-guardar"
            [disabled]="formMascota.invalid || creando"
          >
            {{ creando ? 'Guardando...' : 'Agregar mascota' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
