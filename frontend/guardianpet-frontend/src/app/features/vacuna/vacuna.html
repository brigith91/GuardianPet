<div class="contenedor-centro">
<div class="contenedor">
        <button class="boton-cerrar" [routerLink]="['/tipo'] ">&times;</button>
        <h2 class="titulo">Agregar Vacuna</h2>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Nombre</label>
                <input type="text" class="entrada" placeholder="Nombre de la vacuna" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea class="entrada-texto" placeholder="Descripción de la vacuna" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar vacuna</button>
        </form>
    </div>
</div>
