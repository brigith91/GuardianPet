<div class="contenedor-centro">
<div class="contenedor">
        <button class="boton-cerrar">&times;</button>
        <h2 class="titulo">Agregar Vacuna</h2>

        <form (ngSubmit)="onSubmit()">
            <div class="campo">
                <label class="etiqueta">Nombre</label>
                <input type="text" [(ngModel)]="nombre" name="nombre" class="entrada" placeholder="Nombre de la vacuna" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea [(ngModel)]="descripcion" name="descripcion" class="entrada-texto" placeholder="Descripción de la vacuna" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar vacuna</button>
        </form>
    </div>
</div>
