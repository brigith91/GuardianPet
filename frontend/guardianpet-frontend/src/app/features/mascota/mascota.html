<div class="contenedor">
        <h1 class="titulo">Agregar nueva Mascota</h1>
        
        <form class="formulario">
            <div class="grupo">
                <label class="etiqueta">Nombre</label>
                <input type="text" class="entrada" placeholder="Nombre del tutor" required>
            </div>

            <div class="grupo">
                <label class="etiqueta">Especie</label>
                <input type="text" class="entrada" placeholder="Nombre de la mascota" required>
            </div>

            <div class="grupo">
                <label class="etiqueta">Raza</label>
                <input type="text" class="entrada" placeholder="Tipo de mascota" required>
            </div>

            <div class="grupo">
                <label class="etiqueta">Sexo</label>
                <input type="text" class="entrada" placeholder="Ingresa la raza" required>
            </div>

            <div class="grupo">
                <label class="etiqueta">Fecha nacimiento</label>
                <input type="date" class="entrada-fecha" placeholder="dd/mm/aaaa" required>
            </div>

            <div class="grupo">
                <label class="etiqueta-archivo">Foto (opcional)</label>
                <input type="file" class="entrada-archivo" accept="image/*">
                <span class="texto-archivo">Subir archivo</span>
            </div>

            <button type="submit" class="boton-agregar">Agregar mascota</button>
        </form>
    </div>
