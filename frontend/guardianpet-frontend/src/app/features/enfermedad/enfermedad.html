<div class="contenedor-centro">
<div class="contenedor">
        <button class="boton-cerrar" (click)="cerrar()">&times;</button>

        <h2 class="titulo">Agregar enfermedad</h2>

        <form (ngSubmit)="onSubmit()">
            <div class="campo">
                <label class="etiqueta">Tipo</label>
                <input type="text" class="entrada" [(ngModel)]="tipo" name="tipo" placeholder="Tipo de enferdemad" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea  [(ngModel)]="descripcion" name="descripcion" class="entrada-texto" placeholder="Descripción de la enfermedad" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar enfermedad</button>
        </form>
    </div>
</div>
