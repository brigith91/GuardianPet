<div class="contenedor">
        <button class="boton-cerrar">&times;</button>
        <h2 class="titulo">Agregar enfermedad</h2>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Tipo</label>
                <input type="text" class="entrada" placeholder="Tipo de enferdemad" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea class="entrada-texto" placeholder="Descripción de la enfermedad" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar enfermedad</button>
        </form>
    </div>
