<div class="contenedor-centro">
<div class="formulario" id="formulario">
  <form (ngSubmit)="onSubmit()">
    <div class="contenido">
      <div class="logo">
        <div class="logo_texto">Guardian<span>Pet</span></div>
      </div>

      <!-- name + minLength útiles para el backend -->
      <input [(ngModel)]="nombre"     name="nombre"     type="text"     placeholder="Nombres"             required minlength="2"/>
      <input [(ngModel)]="apellidos"  name="apellidos"  type="text"     placeholder="Apellidos"/>

      <input [(ngModel)]="telefono"   name="telefono"   type="tel"      placeholder="Teléfono"/>
      <input [(ngModel)]="email"      name="email"      type="email"    placeholder="Correo electrónico"   required/>

      <!-- number se envía como string en JS → conviértelo a número en onSubmit() -->
      <input [(ngModel)]="cedula"     name="cedula"     type="number"   placeholder="Cédula"               required min="1000000"/>

      <input [(ngModel)]="contrasena" name="contrasena" type="password" placeholder="Contraseña"           required minlength="6"/>

      <div class="volver">
        <!-- mejor usar routerLink para no recargar -->
        <a routerLink="/indice">Volver</a>
      </div>

      <div class="registra">
        ¿Tienes una cuenta?
        <a routerLink="/login"><span class="ini">Iniciar sesión</span></a>
      </div>




      <button type="submit" class="registro_boton">Registrarse</button>
    </div>
  </form>

  <div class="imagen">
    <h2>Regístrese</h2>
    <p>Registre sus datos para poder utilizar las funciones del sitio</p>

    <img src="assets/negro.png" alt="Perrito" class="negro" />

    <img src="assets/pa.png" alt="Patitas" class="patas" />
  </div>
</div>
</div>
