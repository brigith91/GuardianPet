<div class="contenedor-centro">
<div class="formulario">
  <form (ngSubmit)="onSubmit()">
    <div class="contenido">


      <div class="logo">
        <div class="logo_texto">Guardian<span>Pet</span></div>
      </div>


          <input [(ngModel)]="email" name="email" type="email" placeholder="Correo electronico" required/>
          <input [(ngModel)]="contrasena" name="contrasena" type="contrasena" placeholder="contraseña" required/>

              <div class="volver">
                <a  routerLink="/indice">Volver</a>
              </div>



          <div class="registra">
                ¿No tienes cuenta?
                <a  routerLink="/registro"><span class="ini">Registrarse</span></a>
        </div>


          



      <button class="registro_boton" type="submit" [disabled]="loading">Iniciar sesión</button>
      <p class="error" *ngIf="error">{{error}}</p>
    </div>
  </form>



    <div class="imagen">

      <h2>Inicie sesión</h2>
      <p>Ingrese sus datos para poder utilizar las funciones del sitio</p>

      <img src="assets/negro.png" alt="Perrito" class="negro">

      <img src="assets/pa.png" alt="Patitas" class="patas">
    </div>
</div>

</div>
