<div class="auth-card">
  <h2>Restablecer contraseña</h2>

  <ng-container *ngIf="!done; else doneTpl">
    <p *ngIf="!token" class="err">Falta el token en la URL. Abre el enlace del correo.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="token">
      <label>Nueva contraseña</label>
      <input type="password" formControlName="contrasena" placeholder="Mínimo 6 caracteres" />
      <div class="err" *ngIf="form.controls.contrasena.invalid && form.controls.contrasena.touched">
        Debe tener al menos 6 caracteres.
      </div>

      <label>Confirmar contraseña</label>
      <input type="password" formControlName="confirm" placeholder="Repite la contraseña" />
      <div class="err" *ngIf="form.hasError('mismatch') && form.controls.confirm.touched">
        Las contraseñas no coinciden.
      </div>

      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </button>
    </form>

    <div class="err" *ngIf="error">{{ error }}</div>
  </ng-container>

  <ng-template #doneTpl>
    <p class="ok">¡Listo! Tu contraseña fue actualizada.</p>
    <button (click)="goLogin()">Ir a iniciar sesión</button>
  </ng-template>
</div>
