<div class="contenedor">
        <button class="boton-cerrar">&times;</button>
        <h2 class="titulo">Agregar Tratamiento</h2>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Tipo</label>
                <input type="text" class="entrada" placeholder="Tipo de tratamiento" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Fecha</label>
                <input type="date" class="entrada" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Fecha fin</label>
                <input type="date" class="entrada" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea class="entrada-texto" placeholder="Descripción del tratamiento" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar tratamiento</button>
        </form>
    </div>
