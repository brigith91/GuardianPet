<div class="contenedor-centro">
    <div class="contenedor">
        <button class="boton-cerrar" (click)="cerrar()">&times;</button>

        <h2 class="titulo">Agregar Operacion</h2>

        <form class="formulario">
            <div class="campo">
                <label class="etiqueta">Tipo</label>
                <input type="text" class="entrada" placeholder="Tipo de  operacion" required>
            </div>

            <div class="campo">
                <label class="etiqueta">Descripción</label>
                <textarea class="entrada-texto" placeholder="Descripción de la operacion" required></textarea>
            </div>

            <button type="submit" class="boton-guardar">Guardar operacion</button>
        </form>
    </div>
</div>
