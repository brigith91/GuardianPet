<div class="formulario">
  <form (ngSubmit)="onSubmit()">
    <div class="contenido">


      <div class="logo">
          <img class="imagen-logo"  src="assets/logo.png" alt="Logo GuardianPet" >
        <div class="logo_texto">Guardian<span>Pet</span></div>
      </div>


          <input [(ngModel)]="email" name="email" type="email" required/>
          <input [(ngModel)]="contrasena" name="contrasena" type="contrasena" required/>

              <div class="volver">
                <a   href="index.html">Volver</a>
              </div>



          <div class="registra">
                ¿No tienes cuenta?
                <a  routerLink="/registro"><span class="ini">Registrarse</span></a>
        </div>


          <div class="terminos">
            <input type="checkbox"  required>
            <label>Acepto los <a>Términos y Condiciones</a></label>
          </div>




      <button class="registro_boton" type="submit" [disabled]="loading">Iniciar sesión</button>
      <p class="error" *ngIf="error">{{error}}</p>
    </div>
  </form>



    <div class="imagen">

      <h2>Inicie sesión</h2>
      <p>Ingrese sus datos para poder utilizar las funciones del sitio</p>

      <img src="assets/negro.png" alt="Perrito" class="negro">

      <img src="assets/pa.png" alt="Patitas" class="patas">
    </div>
</div>
