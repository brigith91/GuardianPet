<div class="formulario" id="formulario">
  <form (ngSubmit)="onSubmit()">
    <div class="contenido">
      <div class="logo">
        <div class="logo_texto">Guardian<span>Pet</span></div>
      </div>

      <input [(ngModel)]="nombre" type="text" placeholder="Nombres" required />
      <input [(ngModel)]="apellidos" type="text" placeholder="Apellidos" required />
      <input [(ngModel)]="telefono" type="tel" placeholder="Telefono" required />
      <input [(ngModel)]="email" type="email" placeholder="Correo electronico" required />
      <input [(ngModel)]="cedula" type="cedula" placeholder="cedula" required />
      <!-- <input [(ngModel)]="contrasena" type="password" placeholder="Contraseña" required> -->
      <!-- <input [(ngModel)]="confirmar_contrasena"type="password" placeholder="Confirmar contraseña" required> -->

      <div class="volver">
        <a href="index.html">Volver</a>
      </div>

      <div class="registra">
        ¿Tienes una cueta?
        <a routerLink="/login"><span class="ini">Iniciar sesión</span></a>
      </div>

      <div class="terminos">
        <input type="checkbox" required />
        <label>Acepto los <a>Términos y Condiciones</a></label>
      </div>

      <button class="registro_boton">Registrarse</button>
    </div>
  </form>

  <div class="imagen">
    <h2>Regístrese</h2>
    <p>Registre sus datos para poder utilizar las funciones del sitio</p>

    <img src="assets/negro.png" alt="Perrito" class="negro" />

    <img src="assets/pa.png" alt="Patitas" class="patas" />
  </div>
</div>
