<header class="barra-superior">
        <div class="logo">
            <img class="imagen-logo"  src="assets/logo.png" alt="Logo GuardianPet" >
            <span class="texto-logo"><strong>Guardian</strong>Pet</span>
        </div>
        
        <div class="barra-busqueda">
            <span class="icono-busqueda">🔍</span>
            <input type="text" class="campo-busqueda" placeholder="Buscar mascota">
        </div>
        
        <div class="perfil-usuario">
            <div class="avatar-usuario">LR</div>
            <span class="nombre-usuario">Lina Roncancio</span>
        </div>
    </header>

    <div class="contenedor-principal">
        
        <aside class="barra-lateral">
            <div class="item-menu activo">
                <span class="icono-menu">🐾</span>
                <span class="texto-menu">Mascotas</span>
            </div>
            
            <div class="seccion-mascotas">
                <h3 class="titul">Mascotas</h3>
                
                <div class="tarjeta-mascota seleccionada">
                    <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=60&h=60&fit=crop" alt="Negro" class="foto-mascota">
                    <div class="info-mascota">
                        <h4 class="nombre-mascota">Negro</h4>
                        <p class="detalles-mascota">Perro • 3 Años</p>
                    </div>
                </div>
               
            </div>
            
            <button class="boton-agregar-mascota">
                <span class="icono-mas">+</span>
                Agregar mascota
            </button>
            
            <div class="item-menu configuracion">
                <span class="icono-menu">⚙️</span>
                <span class="texto-menu">Configuracion</span>
            </div>
        </aside>

        <main class="area-contenido">
            
            <div class="encabezado-mascota">
                <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=100&h=100&fit=crop" alt="Negro" class="foto-mascota-grande">
                <div class="info-mascota-grande">
                    <h2 class="nombre-mascota-grande">Negro</h2>
                    <p class="texto-info">Perro • Rotwailer</p>
                    <p class="texto-info">Dueño •Lina Roncacio</p>
                </div>
                
                <button class="boton-agregar-registro">
                    <span class="icono-mas">+</span>
                    Agregar registro
                </button>
            </div>
            
            <div class="tabs-navegacion">
                <button class="tab activo">Historial clinico</button>
                <button class="tab">Citas Programadas</button>
            </div>
            
            <h3 class="titulo-historial">Historial clinico</h3>
            
            <div class="lista-registros">
                
                <div class="tarjeta-registro">
                    <div class="contenido-registro">
                        <div class="etiqueta-tipo">Vacuna</div>
                        <h4 class="titulo-registro">Vacuna antirrábida</h4>
                        <p class="descripcion-registro">Aplicada correctamente, sin reacciones adversas</p>
                        <div class="info-doctor">
                            <span class="icono-doctor">👨‍⚕️</span>
                            <span class="nombre-doctor">Dr.David</span>
                        </div>
                    </div>
                    <div class="acciones-registro">
                        <span class="fecha-registro">09 de enero de 2025</span>
                        <div class="botones-accion">
                            <button class="boton-icono" title="Editar">✏️</button>
                            <button class="boton-icono" title="Eliminar">🗑️</button>
                            <button class="boton-icono" title="Deshacer">↩️</button>
                        </div>
                    </div>
                </div>
                
                
            </div>
            
        </main>
        
    </div>
