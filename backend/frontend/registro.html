<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <div class="formulario">
    <div class="contenido">

      
      <div class="logo">
       
        <div class="logo_texto">Guardian<span>Pet</span></div>
      </div>
      
         <input type="text" placeholder="Nombres" required>
         <input type="text" placeholder="Apellidos" required>
         <input type="tel" placeholder="Telefono" required>
         <input type="email" placeholder="Correo electronico" required>
         <input type="password" placeholder="Contraseña" required>
         <input type="password" placeholder="Confirmar contraseña" required>
      





        <div class="volver">
  <a   href="index.html">Volver</a>
</div>

         <div class="registra">
               ¿Tienes una cuenta?
               <a  href="iniciar.html"><span class="ini">Iniciar sesión</span></a>
        </div>


         <div class="terminos">
           <input type="checkbox"  required>
           <label>Acepto los <a>Términos y Condiciones</a></label>
         </div>
 



      
      <button class="registro_boton">Registrarse</button>
      
    </div>
    
    <div class="imagen">
     
      <h2>Regístrese</h2>
      <p>Registre sus datos para poder utilizar las funciones del sitio</p>
      
      <img src="fotos/negro.png" alt="Perrito" class="negro">
      
      <img src="fotos/pa.png" alt="Patitas" class="patas">
    </div>
  </div>
</body>
</html>
